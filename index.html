<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb088">
<title>Thanks for the 🍑</title>
<meta name="description" content="You gave me a peach. This is the thank-you.">
<meta property="og:title" content="Thanks for the 🍑">
<meta property="og:description" content="You gave me a peach. This is the thank-you.">
<meta property="og:image" content="https://atoaster.github.io/-/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍑</text></svg>">
<style>
  body { margin: 0; background: #ffb088; }
  /* one caption per scene, scrolling past the fixed hero; positioned so it paints above the landscape and the hero's text, click-through except the button.
     Each is as tall as the screen is with a phone browser's bars showing, the least it ever is. A section taller than what shows has no one place to rest:
     the browser may snap it anywhere within the difference, and shifts it again when the bars come or go. */
  .s { position: relative; height: 100vh; height: 100svh; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 1rem;
       padding: 0 1rem max(7vh, env(safe-area-inset-bottom)); box-sizing: border-box; pointer-events: none; opacity: var(--o, 1); }
  /* With the bars away the screen is taller than a section, so the page runs on below the last one by the difference: that one can still be brought to the top. */
  body::after { content: ''; display: block; height: calc(100lvh - 100svh); }
  .s p { margin: 0; text-align: center; color: #fff; font: 600 clamp(1.1rem, 3.2vw, 1.6rem)/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; text-shadow: 0 2px 6px rgba(0,0,0,.35), 0 10px 40px rgba(0,0,0,.35); }
  .s button { pointer-events: auto; cursor: pointer; border: 0; border-radius: 999px; padding: .9em 1.6em; background: #fff; color: #5a2d5a; font: 600 1rem system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  @supports (animation-timeline: view()) and (animation-range: entry 0% entry 100%) { /* rises in as it scrolls into view; browsers that cannot tie that to scrolling just show it */
    .s p, .s button { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 100%; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(1.5rem); } }
  @media (min-width: 640px) { .s.end { flex-direction: row; justify-content: center; align-items: flex-end; gap: 1.5rem; } .s.end p { margin-bottom: .5rem; } } /* where there is the width, the last caption and its button share a line, and stand no taller than the other captions */
  @media (max-height: 480px) { .s p, .s button { display: none; } } /* shortcut: captions would sit on top of the hero on short landscape phones, so they are hidden there; lay them out beside the peach if that matters */
  @media (pointer: coarse) { html { scroll-snap-type: y proximity; } }
  /* Fixed to the top, and as tall as the screen is with a phone browser's bars tucked away. Nothing here stretches or re-centres as the bars come and go
     mid-scroll; while they show, they simply cover the bottom of it. So the hero keeps clear of that strip (the difference between the tallest and the
     shortest the screen gets) and is centred in what always shows. On a screen wider than it is tall the hero takes most of the height, and the captions
     came to rest on top of its trivia box: there it also keeps clear of the line they rest on. The wider the screen is than tall, the more it keeps clear
     by, up to all of that line; the same on a screen with less than 36rem of height to show. On an upright phone of any ordinary size, where there is
     room to spare, nothing changes. */
  #land, .hero { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; }
  .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; padding: 0 1rem; padding-bottom: clamp(0px, (100vw - 100vh) * .3, 7vh + 2.2rem); padding-bottom: calc(100lvh - 100svh + clamp(0px, max((100vw - 100vh) * .3, 36rem - 100svh), 7vh + 2.2rem)); box-sizing: border-box; pointer-events: none; }
  @media (max-height: 480px) { .hero { padding-bottom: 0; padding-bottom: calc(100lvh - 100svh); } } /* no captions on a screen that short (see above), so nothing but the bars to keep clear of */
  /* The peach has a layer to itself, above the captions, so nothing that scrolls past can be drawn over it. #spot keeps its place among the text in the layer below,
     and #under is kept as tall as that text (see level() in the script), so the two layers centre alike and the peach sits exactly on its spot. */
  .over { z-index: 1; }
  #spot, #seat { width: min(48vmin, 420px); height: min(48vmin, 420px); }
  #seat { flex: none; } /* where the peach is drawn: as a canvas, it never gave way when there was no room, and its seat does not either */
  #peach { display: block; width: 100%; height: 100%; transition: opacity .5s; }
  /* What a finger or the mouse takes hold of, to turn the peach or to bite it, is not the canvas, whose corners are empty, but a circle laid over the fruit:
     the outline of the peach's body, which is the same from every side. There the browser must neither scroll along with one finger nor zoom the page
     under two: both are the peach's own, to turn it and to zoom in on it. A finger put down anywhere else, right beside the fruit included, scrolls the
     page as ever. #grip itself is a line of no height under the peach's seat (its margin takes back the gap it would add, to the last fraction of a
     pixel); the circle stands on it. */
  #grip { flex: none; position: relative; --s: min(48vmin, 420px); width: var(--s); height: 0; margin-top: -2vmin; touch-action: none;
          user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #grip::before { content: ''; position: absolute; left: calc(var(--s) * .104); bottom: calc(var(--s) * .068); width: calc(var(--s) * .792); height: calc(var(--s) * .792);
                  border-radius: 50%; pointer-events: auto; touch-action: none; cursor: grab; } /* touch-action again, for a browser that reads it off the box touched */
  #grip.held::before { cursor: grabbing; }
  /* Zoomed in on (see the script), the peach is no longer drawn in its seat alone but over the whole of its layer, and all of that is where it is taken hold of:
     nothing of the page is left to scroll by until it is zoomed back out. Its seat keeps its place meanwhile, so nothing else moves. */
  .zoomed #peach { position: absolute; left: 0; top: 0; }
  .zoomed #grip { position: static; }
  .zoomed #grip::before { left: 0; top: 0; bottom: auto; width: 100%; height: 100%; border-radius: 0; }
  /* The way back, for anyone who would not think to pinch or roll it small again. It stands on the line the captions rest on, clear of a phone browser's bars. */
  #out { position: absolute; left: 50%; bottom: max(7vh, env(safe-area-inset-bottom)); bottom: calc(100lvh - 100svh + max(7vh, env(safe-area-inset-bottom))); transform: translateX(-50%);
         pointer-events: auto; cursor: pointer; border: 0; border-radius: 999px; padding: .7em 1.3em; white-space: nowrap; color: #fff;
         font: 600 .95rem system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums;
         background: rgba(40, 22, 48, .65); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  @media (prefers-reduced-motion: reduce) { #peach { transition: none; } }
  h1, #trivia { opacity: var(--o, 1); } /* --o: the text gives way to a peach being zoomed in on, as the captions do */
  h1 { margin: 0; text-align: center; color: #fff; letter-spacing: -.02em;
       font: 700 clamp(2rem, 7vw, 5.5rem)/1.1 system-ui, -apple-system, "Segoe UI", sans-serif;
       text-shadow: 0 2px 6px rgba(0,0,0,.35), 0 10px 40px rgba(0,0,0,.35); }
  /* dark backing keeps the small text readable over every scene, including the pale desert */
  #trivia { margin: 0; max-width: 34rem; padding: .6em 1.1em; border-radius: 1.2em; text-align: center; text-wrap: balance; color: #fff;
            font: 500 clamp(.9rem, 2.2vw, 1.15rem)/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            background: rgba(40, 22, 48, .65); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #trivia:empty { display: none; }
</style>
</head>
<body>
<canvas id="land" aria-hidden="true"></canvas>
<div class="hero"><div id="spot"></div><h1>Thanks for the 🍑</h1><p id="trivia"></p></div>
<div class="hero over"><div id="seat"><canvas id="peach" aria-hidden="true"></canvas></div><div id="grip"></div><div id="under"></div><button id="out" type="button" hidden><span id="mag"></span> · Zoom out</button></div>
<script>
'use strict';
const N = 6, TAU = Math.PI * 2;
const coarse = matchMedia('(pointer: coarse)').matches;          // phone/tablet mode: snap, lower DPR
const still = matchMedia('(prefers-reduced-motion: reduce)').matches; // only scroll moves things
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = t => t * t * (3 - 2 * t);
const lerp = (a, b, t) => typeof a == 'number' ? a + (b - a) * t
  : Array.isArray(a) ? a.map((v, i) => lerp(v, b[i], t))
  : Object.fromEntries(Object.keys(a).map(k => [k, lerp(a[k], b[k], t)]));
const rgb = c => `rgb(${c.slice(0, 3).map(Math.round)})`;
const rgba = (c, a) => `rgba(${c.slice(0, 3).map(Math.round)},${a})`;

// Trivia lives in the page itself: no request, so it works wherever the page does.
const TRIVIA = [
  'Honey does not spoil. Jars found in ancient Egyptian tombs were still edible.',
  'An octopus has three hearts and blue blood.',
  'A day on Venus lasts longer than its year.',
  'Botanically, a banana is a berry and a strawberry is not.',
  'The Eiffel Tower grows up to 15 cm taller in summer heat.',
  'Wombat droppings are cube-shaped.',
  'Sharks have been around longer than trees.',
  'Oxford University is older than the Aztec Empire.',
  'A group of flamingos is called a flamboyance.',
  'The national animal of Scotland is the unicorn.',
  'The shortest war on record, between Britain and Zanzibar in 1896, lasted under 45 minutes.',
  'A bolt of lightning is about five times hotter than the surface of the Sun.',
  'There are more possible games of chess than atoms in the observable universe.',
  'The dot over a lowercase i or j is called a tittle.',
  'Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid.',
  'A koala has fingerprints that are hard to tell apart from a human’s.',
  'Australia is wider than the Moon.',
  'A butterfly tastes with its feet.',
  'The designer of the Pringles can had some of his ashes buried in one.',
  'Hummingbirds are the only birds that can fly backwards.',
  'The Moon drifts about 3.8 cm further from Earth every year.',
  'Sunlight takes a little over eight minutes to reach Earth.',
  'There are more trees on Earth than stars in the Milky Way.',
  'Sound travels more than four times faster in water than in air.',
  'Antarctica is the largest desert in the world.',
  'In medieval timekeeping, a moment was 90 seconds.',
  'An average cumulus cloud weighs around 500 tonnes.',
  '“Typewriter” can be typed using only the top row of a QWERTY keyboard.',
  'The plastic tip of a shoelace is called an aglet.',
  'Measured from base to peak, Mauna Kea is taller than Mount Everest.',
  'Russia spans 11 time zones.',
  'The national anthem of Spain has no official lyrics.',
  'Saturn is less dense than water.',
  'An Olympic gold medal is mostly silver.',
  'The # symbol is also called an octothorpe.',
  'A nectarine is a peach without the fuzz: same species, one gene apart.',
];
// A different fact every visit: step through the list, keeping the place in localStorage.
let ti = Math.floor(Math.random() * TRIVIA.length); // first visit, or storage blocked: random pick
try { const last = localStorage.getItem('trivia'); if (last != null) ti = (+last + 1) % TRIVIA.length || 0; localStorage.setItem('trivia', ti); } catch (e) {}
const trivia = document.getElementById('trivia'), triviaText = 'Did you know? ' + TRIVIA[ti];

// One scene per screen of scroll. sky: [top, bottom] rgb. sun: [r,g,b, x, y, radius, glow].
// layers far→near: [r,g,b, amplitude, frequency, baseline] as fractions of the viewport.
const SCENES = [
  { sky: [[255, 150, 125], [255, 225, 190]], sun: [255, 245, 220, .5, .62, .05, .6], haze: [255, 205, 180], stars: 0,
    layers: [[160, 115, 150, .24, 1.1, .52], [125, 85, 125, .20, 1.5, .62], [95, 60, 100, .16, 2.1, .72], [65, 40, 75, .11, 3.0, .84]] },
  { sky: [[90, 160, 240], [205, 232, 250]], sun: [255, 255, 235, .72, .16, .045, .3], haze: [200, 225, 240], stars: 0,
    layers: [[120, 170, 95, .12, .8, .58], [85, 145, 70, .14, 1.2, .66], [60, 120, 55, .15, 1.7, .76], [40, 95, 45, .13, 2.4, .88]] },
  { sky: [[245, 165, 85], [255, 228, 170]], sun: [255, 240, 200, .3, .5, .06, .7], haze: [255, 215, 160], stars: 0,
    layers: [[235, 175, 105, .07, .5, .62], [215, 140, 80, .09, .7, .70], [195, 112, 62, .11, .9, .79], [168, 88, 52, .13, 1.2, .90]] },
  { sky: [[85, 55, 130], [255, 145, 120]], sun: [255, 200, 150, .5, .66, .07, .8], haze: [230, 130, 140], stars: .2,
    layers: [[90, 55, 120, .10, 1.4, .64], [60, 50, 125, .012, 3, .70], [48, 40, 105, .012, 4, .80], [35, 30, 80, .012, 5, .91]] },
  { sky: [[6, 10, 38], [32, 32, 85]], sun: [235, 238, 255, .74, .2, .035, .35], haze: [40, 45, 95], stars: 1,
    layers: [[32, 42, 75, .20, 1.5, .55], [22, 30, 58, .18, 2.0, .64], [14, 20, 42, .16, 3.0, .74], [7, 10, 24, .12, 5.0, .86]] },
  { sky: [[110, 80, 160], [255, 185, 140]], sun: [255, 225, 190, .5, .7, .06, .9], haze: [240, 170, 160], stars: .3,
    layers: [[125, 90, 155, .22, 1.1, .54], [100, 70, 130, .18, 1.5, .63], [78, 52, 108, .14, 2.0, .73], [55, 36, 85, .10, 2.8, .85]] },
];
console.assert(!JSON.stringify(SCENES.map((s, i) => lerp(s, SCENES[(i + 1) % N], .5))).includes('null'), 'scene shapes differ');

const hash = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const noise = (x, s) => { const i = Math.floor(x), u = smooth(x - i); return hash(i + s) * (1 - u) + hash(i + 1 + s) * u; };
const fbm = (x, s) => { let v = 0, a = .5; for (let o = 0; o < 4; o++, x *= 2.1, a *= .5) v += a * noise(x, s + o * 31); return v; };
const height = (si, k, x, off) => { const [, , , amp, freq, base] = SCENES[si].layers[k]; return H * (base - amp * fbm((x + off) / SX * freq * 3, si * 97 + k * 13)); };

const land = document.getElementById('land'), g = land.getContext('2d');
const peach = document.getElementById('peach'), seat = document.getElementById('seat'), grip = document.getElementById('grip'), spot = document.getElementById('spot'), under = document.getElementById('under'), h1 = document.querySelector('h1');
const stage = grip.parentNode, out = document.getElementById('out'), mag = document.getElementById('mag');
const STARS = Array.from({ length: 160 }, () => [Math.random(), Math.random(), .4 + Math.random() * 1.2, Math.random() * TAU]);
let W, H, SX, p = 0, pc = 0, px = 0, py = 0, pxc = 0, pyc = 0;

function draw(t) {
  const q = clamp(pc, 0, N - 1), i = Math.min(N - 2, Math.floor(q)), j = i + 1, f = smooth(q - i);
  const s = lerp(SCENES[i], SCENES[j], f);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, rgb(s.sky[0])); sky.addColorStop(1, rgb(s.sky[1]));
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  if (s.stars > .01) {
    g.fillStyle = '#fff';
    for (const [x, y, r, ph] of STARS) { g.globalAlpha = s.stars * (.55 + .45 * Math.sin(ph + (still ? 0 : t * 1.5))); g.beginPath(); g.arc(x * W, y * H * .65, r, 0, TAU); g.fill(); }
    g.globalAlpha = 1;
  }
  const sun = s.sun, sx = W * sun[3] - pxc * 25, sy = H * sun[4] - pyc * 10, R = Math.min(W, H) * sun[5];
  const glow = g.createRadialGradient(sx, sy, 0, sx, sy, R * 9); glow.addColorStop(0, rgba(sun, sun[6])); glow.addColorStop(1, rgba(sun, 0));
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  g.fillStyle = rgb(sun); g.beginPath(); g.arc(sx, sy, R, 0, TAU); g.fill();
  for (let k = 0; k < 4; k++) {
    const off = q * H * (.15 + .2 * k) + pxc * (12 + 22 * k) + (still ? 0 : t * 6 * (1 + k));
    g.fillStyle = rgb(lerp(s.layers[k].slice(0, 3), s.haze, (3 - k) * .17)); g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 3; x += 3) g.lineTo(x, lerp(height(i, k, x, off), height(j, k, x, off), f) - pyc * (4 + 6 * k));
    g.lineTo(W + 3, H); g.fill();
  }
}

// Ray-marched peach, built the way the fruit is: fuzzy skin over flesh over a furrowed pit, so a bite cuts through all three.
// map() holds the shapes. Anything finer than a few pixels (stipple, fibres, pores) is colour and bump, faded out before it can alias.
const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#define LITE
#endif
// V: the view. V.xy: where on the canvas the middle of the picture lies, V.z: how much of the picture one pixel is (the canvas is 2 tall, unless zoomed in on).
// C: turns the camera's frame into the peach's. B[i]: a bite's centre, and a random number of its own. U[i]: the jaw's axis across that bite, and 1/|centre|.
// The first MAXB-1 are the visitor's bites, the rest the feast the last one sets off. NB: how many are taken. GONE: 1 once only the pit is left.
// S: this peach's noise offset. Z[0], Z[1]: bruises, Z[2]: a scar (where on the fruit, how big). ST: 1 while the stem still has something to hold on to, 0 once it has not, 2 to draw stem and leaf with nothing else (for when they fall).
#define MAXB 7   // bites it takes to finish a peach
#define FEAST 12 // bites in the feast
uniform vec3 V;uniform mat3 C;uniform vec4 B[MAXB-1+FEAST],U[MAXB-1+FEAST],Z[3];uniform vec3 S;uniform int NB;uniform float ST,GONE;
#define TH .022 // how thick the skin is
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
#ifdef LITE
// LITE: no shadows and no noise (its hash needs highp), so every random detail sits at its average
#define DET 0.
float vn(vec3 x){return .5;}
float dots(vec3 x,float n){return 0.;}
#else
#define DET 1.
vec3 h3(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
#define G(c) dot(h3(i+c)*2.-1.,f-c)
float vn(vec3 x){ // gradient noise, around .5 and mostly within .2 to .8
  vec3 i=floor(x),f=fract(x),u=f*f*(3.-2.*f);vec2 o=vec2(0.,1.);
  return .5+.6*mix(mix(mix(G(o.xxx),G(o.yxx),u.x),mix(G(o.xyx),G(o.yyx),u.x),u.y),mix(mix(G(o.xxy),G(o.yxy),u.x),mix(G(o.xyy),G(o.yyy),u.x),u.y),u.z);
}
float dots(vec3 x,float n){ // round specks: one to a cell in a fraction n of the cells, each of its own size
  vec3 i=floor(x),r=h3(i),k=h3(i+7.);
  return step(k.x,n)*(1.-smoothstep(.6,1.,length(fract(x)-.3-.4*r)/(.12+.16*k.y)));
}
#endif
const mat3 M=mat3(.36,.48,-.8,-.8,.6,0.,.48,.64,.6); // turns each octave so the lattice never lines up with itself
float fbm(vec3 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vn(p);p=M*p*2.03+17.;a*=.5;}return .5+(v-.469)*1.3;}
float fade(float f,float px){return 1.-smoothstep(.25,.7,f*px);} // 1 while detail of frequency f is wider than a pixel, 0 once it is not

float ell(vec3 p,vec3 r){float k0=length(p/r),k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float groove(vec3 p){return exp(-p.x*p.x*32.)*smoothstep(-.3,.5,p.z)*smoothstep(-1.2,.1,p.y);} // the crease
float cavity(vec3 p){return exp(-dot(p.xz,p.xz)*10.)*smoothstep(.2,1.,p.y);}                   // the dimple the stem sits in
// Skin surface: squashed sphere, a crease with a cheek either side (one a little fuller), a dimple for the stem, a point at the tip, and some lumpiness.
float body(vec3 p){
  float e=length(p*vec3(.93,.98,.96))-1.;
  if(e>.3)return e-.12; // too far off for the rest to matter
  vec3 q=p-vec3(0.,-1.,.1);float ch=abs(p.x)-.45,a=1./(1.+dot(p.xz,p.xz)*35.),b=1./(1.+dot(q,q)*45.);
  return e+.1*groove(p)-(.07+.012*p.x)*exp(-ch*ch*6.)*smoothstep(-.4,.6,p.z)+.12*cavity(p)
    +.03*a*a*smoothstep(.4,1.,p.y)-.025*b*b+.012*sin(p.x*3.+S.x)*sin(p.y*2.6+p.z*3.2+S.y);
}
// What the bites take out (positive inside one). d: the skin surface at p, so the cut can treat skin and flesh differently.
// Only the nearest bite gets its tooth marks worked out, and they fade where it runs into the next one, so the surface stays whole.
float bites(vec3 p,float d){
  float b=-1e3,b2=-1e3,c;vec3 o,q=vec3(0.);vec4 kb=vec4(0.),ku=vec4(0.); // b, q, kb, ku: the nearest bite. b2: the runner-up.
  // The visitor's bites are written out one by one, inside a loop of one so that break can stop at the last bite taken.
  // Measured under software rendering, that costs a fraction of what indexing B[i] from a real loop does.
  // The feast's bites are bigger, and only there for a second, so a real loop will do for them.
  #define BITE(i,r) if(NB<=i)break;o=p-B[i].xyz;c=r-length(o);if(c>b){b2=b;b=c;q=o;kb=B[i];ku=U[i];}else b2=max(b2,c);
  for(int once=0;once<1;once++){BITE(0,.42)BITE(1,.42)BITE(2,.42)BITE(3,.42)BITE(4,.42)BITE(5,.42)for(int i=MAXB-1;i<MAXB-1+FEAST;i++){BITE(i,.76)}}
  if(b>.16)return b-.075; // well inside the hollow: its wall is at least this far off, however it is dented
  if(b>-.1){ // close enough to see the teeth: s runs across them, v the way they travelled
    float k=kb.w,s=dot(q,ku.xyz),v=dot(q,cross(kb.xyz,ku.xyz))*ku.w+(k-.5)*.08,f=smoothstep(0.,.07,b-b2);
    float t=abs(fract(s*5.+k)*2.-1.),w=b-.075,m=max(0.,1.-v*v*250.);c=.022*t*t+.016*m*m; // a ridge left between each pair of teeth, a seam where upper and lower met
