// A different fact every visit, and with every new peach: dealt like cards from a shuffled pack, so that none comes round again until all the others
// have been seen. What is left of the pack is kept in localStorage, as the numbers of the facts still to come, the next one last. It is never left
// empty there: when the last is dealt a new pack is shuffled, and not with that same fact on top. Where nothing can be kept, every visit shuffles afresh.
const trivia = document.getElementById('trivia');
let dealt = -1, triviaText = ''; // the fact that is showing, and how it reads
function deal() {
  const fresh = () => { // every fact, shuffled, with any but the one showing to come next
    const p = TRIVIA.map((_, i) => i), n = p.length - 1;
    for (let i = n; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
    if (p[n] == dealt) [p[0], p[n]] = [p[n], p[0]];
    return p;
  };
  let pack; try { pack = JSON.parse(localStorage.getItem('trivia')); } catch (e) {}
  pack = Array.isArray(pack) ? pack.filter(i => Number.isInteger(i) && i >= 0 && i < TRIVIA.length) : []; // (anything else there, such as the single number an earlier version kept, counts as no pack)
  if (!pack.length) pack = fresh();
  dealt = pack.pop(); if (!pack.length) pack = fresh();
  try { localStorage.setItem('trivia', JSON.stringify(pack)); } catch (e) {}
  triviaText = 'Did you know? ' + TRIVIA[dealt];
}
deal();

  const now = performance.now(), d = e.deltaY * (e.deltaMode == 1 ? 32 : e.deltaMode == 2 ? 400 : 1); // lines and pages, for mice that count in those
  if (zto == 1 && d >= 0 && !e.ctrlKey) { if (now - rolled < 350) { rolled = now; e.preventDefault(); } return; }
  e.preventDefault(); rolled = touched = now; vel = ramp = 0;
  zto = clamp(zto * Math.exp(-d * (e.ctrlKey ? .01 : .0028)), 1, zmax()); zx = e.clientX; zy = e.clientY;
  if (e.ctrlKey) zoomAt(zto, zx, zy); // a pinch is followed, not eased after
}, { passive: false });
grip.addEventListener('gesturestart', e => { e.preventDefault(); pinched = zoom; });
grip.addEventListener('gesturechange', e => { e.preventDefault(); if (pinched && pts.size < 2) { zoomAt(pinched * e.scale, midX = e.clientX, midY = e.clientY); zto = zoom; touched = performance.now(); } }); // (two fingers on a screen are followed above)
grip.addEventListener('gestureend', e => { e.preventDefault(); pinched = 0; });
// The way back to the normal view without rolling or pinching all the way: the button that shows while it is zoomed in on, or Escape.
const home = () => { const r = seat.getBoundingClientRect(); zto = 1; zx = r.left + r.width / 2; zy = r.top + r.height / 2; vel = 0; touched = performance.now(); };
out.onclick = home;
addEventListener('keydown', e => { if (e.key == 'Escape' && zto > 1) home(); });

const LINES = [gl ? 'Take a bite, then scroll.' : 'Scroll on.', 'You gave me a peach.', 'It was a good peach.', 'Ripe, sweet, gone in a minute.', 'I wanted you to know.', 'Thank you.'];
console.assert(LINES.length == N, 'one line per scene');
for (let i = 0; i < N; i++) { const s = document.body.appendChild(document.createElement('div')); s.className = i == N - 1 ? 's end' : 's'; s.innerHTML = `<p>${LINES[i]}</p>` + (i == N - 1 ? '<button id="share" type="button">Pass it on</button>' : ''); }
captions = document.querySelectorAll('.s p, .s button');
document.getElementById('share').onclick = async function () {
  const url = location.origin + location.pathname;
  if (navigator.share) return navigator.share({ title: document.title, url }).catch(() => {}); // closing the share sheet is not an error
  try { await navigator.clipboard.writeText(url); this.textContent = 'Link copied'; } catch (e) { prompt('Copy this link', url); } // no clipboard on plain http
};
